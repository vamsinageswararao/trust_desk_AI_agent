spring.application.name=trustdesk

# --- Persistence (SQLite, local). Override path with TRUSTDESK_DB_PATH. ---
spring.datasource.url=jdbc:sqlite:${TRUSTDESK_DB_PATH:./trustdesk.db}?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer; one pooled connection avoids SQLITE_BUSY.
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Schema comes from schema.sql (Hibernate's SQLite dialect cannot create foreign keys). Hibernate only maps.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.open-in-view=false

# --- API JSON: snake_case to match docs/API_CONTRACT.md ---
spring.jackson.property-naming-strategy=SNAKE_CASE

# --- TrustDesk ---
# Demo token has NO default on purpose: the app refuses to start without TRUSTDESK_DEMO_TOKEN.
trustdesk.auth.token=${TRUSTDESK_DEMO_TOKEN:}
trustdesk.seed.enabled=true
trustdesk.seed.data-dir=${TRUSTDESK_DATA_DIR:./data}

# Knowledge search: topK defaults to 3 and is capped at 10 (configurable).
trustdesk.retrieval.default-top-k=3
trustdesk.retrieval.max-top-k=10

# Optional second token with the manager role (needed to approve tool actions). If blank, the single demo token
# above also acts as manager (demo mode).
trustdesk.auth.manager-token=${TRUSTDESK_MANAGER_TOKEN:}

# AI provider: mock (default, deterministic, offline) | openai-compatible (Groq/Ollama/OpenAI...) | unconfigured
trustdesk.ai.provider=${TRUSTDESK_AI_PROVIDER:mock}
trustdesk.ai.base-url=${TRUSTDESK_AI_BASE_URL:}
trustdesk.ai.api-key=${TRUSTDESK_AI_API_KEY:}
trustdesk.ai.model=${TRUSTDESK_AI_MODEL:}
trustdesk.ai.timeout-seconds=30

# Guardrails: evidence must score at least min-evidence-score, come from a trusted audience, and retrieval asks for top-k.
trustdesk.guardrails.min-evidence-score=1.0
trustdesk.guardrails.retrieval-top-k=5
trustdesk.guardrails.trusted-audiences=Customer support agents,Engineering and support administrators
